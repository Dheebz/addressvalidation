global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  timeout connect 1s
  timeout client 300s
  timeout server 300s
  retries 1

resolvers docker
  nameserver internal 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend public_api
  bind *:8080
  default_backend api_replicas

backend api_replicas
  balance roundrobin
  option httpchk GET /health/ready
  http-check expect status 200
  option redispatch
  http-response set-header X-Api-Instance %[srv_name]
  server api-a address-api:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr none
  server api-b address-api-b:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr none
